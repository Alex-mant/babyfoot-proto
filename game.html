<style>
:root{
  --paper:#0F1411; --surface:#161D19; --sunk:#1B231E;
  --ink:#E5EAE5; --ink-2:#AEBAB3; --ink-3:#7C8A83;
  --line:#2A342E; --green:#4FB183; --red:#D65445; --blue:#4E8CC4;
  --f-d:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-m:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overflow:hidden;overscroll-behavior:none;background:#0F1411}
body{height:100dvh;color:var(--ink);font-family:var(--f-d);font-size:15px;
  touch-action:none;user-select:none;-webkit-user-select:none;position:relative}
canvas{display:block;width:100%;height:100%;position:absolute;inset:0}

/* colonne de barres, dans la marge gauche */
#rods{position:absolute;left:0;top:0;bottom:0;width:clamp(72px,11vw,104px);z-index:3;
  display:flex;flex-direction:column;gap:6px;
  padding:6px 6px 6px calc(6px + env(safe-area-inset-left))}
.rodbtn{flex:1 1 0;min-height:0;font-family:var(--f-m);font-size:.62rem;font-weight:600;
  border:1px solid var(--line);background:rgba(22,29,25,.86);color:var(--ink-3);
  border-radius:8px;cursor:pointer;padding:.2rem .1rem;line-height:1.1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;
  backdrop-filter:blur(3px)}
.rodbtn .lab{font-size:clamp(1.15rem,3.4vh,1.7rem);font-family:var(--f-d);font-weight:800;line-height:1}
.rodbtn.t0{color:var(--red)} .rodbtn.t1{color:var(--blue)}
.rodbtn.on{border-color:currentColor;background:rgba(79,177,131,.14);box-shadow:inset 0 0 0 1px currentColor}
.rodbtn.has{outline:2px solid #FFE07A;outline-offset:-2px}
.autobtn{flex:0 0 auto;font-family:var(--f-m);font-size:.58rem;font-weight:600;letter-spacing:.06em;
  border:1px solid var(--line);background:rgba(22,29,25,.86);color:var(--ink-3);
  border-radius:8px;cursor:pointer;padding:.45rem .1rem;line-height:1.15;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;
  backdrop-filter:blur(3px)}
.autobtn b{font-family:var(--f-d);font-size:.82rem;font-weight:800;letter-spacing:0}
.autobtn.on{color:var(--green);border-color:var(--green);background:rgba(79,177,131,.16)}

#pow{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--green);z-index:4}
#hint{position:absolute;left:0;right:0;bottom:calc(6px + env(safe-area-inset-bottom));z-index:2;
  display:grid;grid-template-columns:1fr 1fr;justify-items:center;pointer-events:none}
#hint span{font-family:var(--f-m);font-size:.6rem;font-weight:600;letter-spacing:.1em;
  color:var(--ink-2);background:rgba(15,20,17,.78);padding:.2rem .55rem;border-radius:4px}
#tuneBtn{position:absolute;right:calc(6px + env(safe-area-inset-right));top:6px;z-index:4;
  background:rgba(22,29,25,.86);border:1px solid var(--line);color:var(--ink-3);
  font-family:var(--f-m);font-size:.62rem;font-weight:600;padding:.28rem .45rem;border-radius:4px;cursor:pointer}

#ov{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
  background:rgba(15,20,17,.94);padding:1rem;text-align:center}
#ov.on{display:flex}
#ov .box{max-width:33rem;width:100%}
#ov h2{font-size:clamp(1.25rem,5vw,1.8rem);font-weight:800;margin:0 0 .4rem;letter-spacing:-.02em}
#ov p{color:var(--ink-2);font-size:.82rem;margin:0 0 .9rem;line-height:1.55}
#ov .btns{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
.bigbtn{font-family:var(--f-d);font-weight:600;font-size:.9rem;padding:.6rem 1.15rem;border-radius:6px;
  cursor:pointer;border:1px solid var(--line);background:var(--sunk);color:var(--ink);min-width:7.5rem}
.bigbtn.pri{background:var(--green);border-color:var(--green);color:#07110C}
.bigbtn:active{transform:translateY(1px)}
#code{font-family:var(--f-m);font-size:2.2rem;font-weight:600;letter-spacing:.3em;
  color:var(--green);margin:.3rem 0 .1rem;text-indent:.3em}
#codein{font-family:var(--f-m);font-size:1.6rem;font-weight:600;letter-spacing:.25em;text-align:center;
  text-transform:uppercase;width:8em;padding:.4rem;background:var(--sunk);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;margin-bottom:.8rem}

#tune{position:absolute;right:.5rem;top:2.2rem;z-index:11;width:min(20rem,88vw);background:var(--surface);
  border:1px solid var(--line);border-radius:6px;padding:.7rem .8rem;display:none;max-height:84%;overflow:auto}
#tune.on{display:block}
#tune h3{font-size:.68rem;margin:0 0 .5rem;font-family:var(--f-m);letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3)}
.tr{display:grid;grid-template-columns:1fr auto;gap:.05rem .4rem;align-items:center;margin-bottom:.4rem}
.tr label{font-size:.7rem;color:var(--ink-2)}
.tr output{font-family:var(--f-m);font-size:.68rem;color:var(--green);font-variant-numeric:tabular-nums}
.tr input{grid-column:1/-1;width:100%;accent-color:var(--green);margin:.05rem 0 0}
#logout{width:100%;font-family:var(--f-m);font-size:.58rem;height:6rem;background:var(--sunk);
  color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:.35rem;resize:none}

#rot{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
  text-align:center;background:var(--paper);padding:2rem}
#rot b{display:block;font-size:1.25rem;font-weight:800;margin-bottom:.5rem;letter-spacing:-.02em}
#rot span{font-size:.82rem;color:var(--ink-2);line-height:1.6}
@media (max-aspect-ratio:1/1){ #rot{display:flex} body>*:not(#rot){visibility:hidden} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<canvas id="cv"></canvas>
<div id="rods"></div>
<div id="pow"></div>
<div id="hint"><span>↕ placer</span><span>↔ frapper</span></div>
<button id="tuneBtn">RÉG</button>

<div id="ov" class="on"><div class="box">
  <h2 id="ovT">Babyfoot</h2><p id="ovP"></p><div class="btns" id="ovB"></div>
</div></div>

<div id="tune">
  <h3>Réglages</h3>
  <div class="tr"><label>Longueur de la figurine (mm)</label><output id="o_lf"></output><input type="range" id="i_lf" min="35" max="85" step="1"></div>
  <div class="tr"><label>Vitesse angulaire max (rad/s)</label><output id="o_omax"></output><input type="range" id="i_omax" min="8" max="60" step="1"></div>
  <div class="tr"><label>Pesanteur (× réel)</label><output id="o_grav"></output><input type="range" id="i_grav" min="0.2" max="3" step="0.05"></div>
  <div class="tr"><label>Amortissement rotation (/s)</label><output id="o_adamp"></output><input type="range" id="i_adamp" min="0.4" max="8" step="0.1"></div>
  <div class="tr"><label>Adhérence du pied</label><output id="o_grip"></output><input type="range" id="i_grip" min="0" max="0.95" step="0.02"></div>
  <div class="tr"><label>Restitution du pied</label><output id="o_figr"></output><input type="range" id="i_figr" min="0.05" max="0.7" step="0.01"></div>
  <div class="tr"><label>Arrondi du pied (mm)</label><output id="o_crn"></output><input type="range" id="i_crn" min="0" max="8" step="0.5"></div>
  <div class="tr"><label>Restitution des bandes</label><output id="o_wall"></output><input type="range" id="i_wall" min="0.4" max="0.95" step="0.01"></div>
  <div class="tr"><label>Friction du tapis (/s)</label><output id="o_fric"></output><input type="range" id="i_fric" min="0.2" max="1.6" step="0.05"></div>
  <div class="tr"><label>Vitesse max de la balle (mm/s)</label><output id="o_vmax"></output><input type="range" id="i_vmax" min="1200" max="5000" step="50"></div>
  <div class="tr"><label>Vitesse de coulissement (mm/s)</label><output id="o_slew"></output><input type="range" id="i_slew" min="400" max="4500" step="50"></div>
  <div class="tr"><label>Délai balle morte (s)</label><output id="o_stall"></output><input type="range" id="i_stall" min="0.8" max="6" step="0.1"></div>
  <div class="tr"><label>Suivi auto des barres libres — 0 = aucun</label><output id="o_ast"></output><input type="range" id="i_ast" min="0" max="1" step="0.05"></div>
  <div class="tr"><label>Niveau de l'IA (solo)</label><output id="o_ai"></output><input type="range" id="i_ai" min="0.15" max="1" step="0.05"></div>
  <div class="tr"><label>Seuil chiquenaude (px)</label><output id="o_trv"></output><input type="range" id="i_trv" min="10" max="70" step="1"></div>
  <div class="tr"><label>Fenêtre chiquenaude (ms)</label><output id="o_win"></output><input type="range" id="i_win" min="60" max="260" step="10"></div>
  <div class="tr"><label>Vitesse pour puissance max (px/s)</label><output id="o_pwv"></output><input type="range" id="i_pwv" min="600" max="5000" step="50"></div>
  <div class="btns" style="margin:.5rem 0 .4rem">
    <button class="bigbtn" id="dumpBtn" style="min-width:0;font-size:.75rem;padding:.35rem .7rem">Journal</button>
    <button class="bigbtn" id="resetBtn" style="min-width:0;font-size:.75rem;padding:.35rem .7rem">Défauts</button>
    <button class="bigbtn" id="menuBtn" style="min-width:0;font-size:.75rem;padding:.35rem .7rem">Menu</button>
  </div>
  <textarea id="logout" readonly placeholder="Journal"></textarea>
</div>

<div id="rot"><div><b>Tourne ton téléphone</b><span>Le geste suppose un écran horizontal :<br>glisser ↕ pour déplacer, claquer ↔ pour frapper.</span></div></div>

<script>
"use strict";
/* ==================================================================
   BABYFOOT — moteur physique fidèle
   La figurine est un PENDULE monté sur la barre. Deux degrés de
   liberté : translation le long de la barre, rotation autour d'elle.
   Rien n'est « appliqué » à la balle : elle est frappée quand le pied
   la rencontre, à la vitesse qu'a ce pied à cet instant.
   ================================================================== */

const W=1200, H=680, GY0=240, GY1=440;
const BR=17.5;                 // rayon de la balle (35 mm, liège Bonzini)
const FHX=9, FHY=20;           // demi-dimensions du pied
const G=9810;                  // pesanteur, mm/s²

// Ordre réel : G_r · D_r · A_b · M_r · M_b · A_r · D_b · G_b
// Chaque équipe progresse vers le but adverse, sa défense toujours
// entre son gardien et l'attaque adverse.
const RODS=[
  {x:  75,team:0,n:1,sp:  0,span:110,kind:'G'},
  {x: 225,team:0,n:2,sp:230,span:115,kind:'D'},
  {x: 375,team:1,n:3,sp:185,span: 92,kind:'A'},
  {x: 525,team:0,n:5,sp:120,span: 60,kind:'M'},
  {x: 675,team:1,n:5,sp:120,span: 60,kind:'M'},
  {x: 825,team:0,n:3,sp:185,span: 92,kind:'A'},
  {x: 975,team:1,n:2,sp:230,span:115,kind:'D'},
  {x:1125,team:1,n:1,sp:  0,span:110,kind:'G'},
];
const KN={G:'gardien',D:'défense',M:'demis',A:'attaque'};
const DIR=t=>t===0?1:-1;
const T0=[0,1,3,5], T1=[2,4,6,7];
const MYRODS=t=>t===0?T0:T1;

const DEF={
  lf:55, omax:26, grav:1, adamp:2.6,
  grip:0.55, figr:0.22, crn:4,
  wall:0.70, fric:0.90, vmax:2600, slew:1500,
  stall:2.5, ast:0, ai:0.55,
  trv:25, win:120, pwv:2600,
};
let P=Object.assign({},DEF);
try{const t=localStorage.getItem('bf6_tune'); if(t)P=Object.assign(P,JSON.parse(t));}catch(e){}

const S={
  phase:'menu', score:[0,0], me:0, sel:-1,
  ball:{x:W/2,y:H/2,vx:0,vy:0},
  flash:0, trail:[], serveTo:1, stall:0,
  matchN:0, chain:0, t0:0, firstGoalMs:null, log:[], auto:false,
};
const NET={mode:'off', peer:null, conn:null, code:'', up:false, lastRx:0, err:''};
RODS.forEach(r=>{r.off=0; r.tgt=0; r.vy=0; r.th=0; r.om=0; r.aiT=0; r.aiT2=0;});

const isHost=()=>NET.mode==='host'||NET.mode==='off';
const FLIP=()=>S.me===1;
const figY=(r,i)=>H/2+(i-(r.n-1)/2)*r.sp+r.off;

/* --------- géométrie du pendule ---------
   th = 0 : la figurine pend, pied au sol, en position de blocage.
   En tournant, le pied avance en x et s'élève ; passé la hauteur de la
   balle, il ne la touche plus et elle passe dessous.                     */
const footX  = r => r.x + P.lf*Math.sin(r.th);
const footH  = r => P.lf*(1-Math.cos(r.th));
const footDown = r => footH(r) < BR*2;
const footVX = r => P.lf*Math.cos(r.th)*r.om;

/* ------------------------------ vue ------------------------------ */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let V={s:1,ox:0,oy:0};
const TOPH=34;
const GUT=()=>(document.getElementById('rods').offsetWidth||72)+8;
function resize(){
  const dpr=Math.min(devicePixelRatio||1,2.5), w=innerWidth, h=innerHeight;
  cv.width=Math.max(1,Math.round(w*dpr)); cv.height=Math.max(1,Math.round(h*dpr));
  cv.style.width=w+'px'; cv.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const g=GUT(), aw=w-g-10, ah=h-TOPH-8;
  const s=Math.min(aw/W,ah/H);
  V.s=s; V.ox=g+(aw-W*s)/2; V.oy=TOPH+(ah-H*s)/2;
}
const SX=x=>V.ox+(FLIP()?(W-x):x)*V.s;
const SY=y=>V.oy+(FLIP()?(H-y):y)*V.s;
addEventListener('resize',resize);

/* --------------------------- les barres -------------------------- */
function stepRods(h){
  for(const r of RODS){
    // translation : coulissement borné, vitesse limitée
    r.tgt=Math.max(-r.span,Math.min(r.span,r.tgt));
    const d=r.tgt-r.off, step=Math.sign(d)*Math.min(Math.abs(d),P.slew*h);
    r.off+=step; r.vy=(h>0)?step/h:0;
    r.off=Math.max(-r.span,Math.min(r.span,r.off));

    // rotation : pendule amorti. La figurine retombe d'elle-même en
    // position de blocage, exactement comme sur une vraie table.
    r.om -= (G*P.grav/P.lf)*Math.sin(r.th)*h;
    r.om *= Math.exp(-P.adamp*h);
    r.th += r.om*h;
    // pas de roulette : le tour complet est interdit, comme en compétition
    if(r.th> Math.PI){ r.th= Math.PI; r.om=Math.min(0,r.om); }
    if(r.th<-Math.PI){ r.th=-Math.PI; r.om=Math.max(0,r.om); }
  }
}
// la chiquenaude ne fait qu'une chose : donner de la vitesse angulaire
function swing(ri,dir,pow01){
  const r=RODS[ri];
  r.om = dir*P.omax*(0.25+0.75*Math.max(0,Math.min(1,pow01)));
  S.log.push({t:'swing',m:S.matchN,team:r.team,rod:r.kind,pow:+pow01.toFixed(2),ms:Date.now()-S.t0});
}

/* ---------------------------- physique --------------------------- */
function capV(){
  const b=S.ball, sp=Math.hypot(b.vx,b.vy);
  if(sp>P.vmax){ b.vx=b.vx/sp*P.vmax; b.vy=b.vy/sp*P.vmax; }
}
function stepSub(h){
  stepRods(h);
  const b=S.ball;
  b.x+=b.vx*h; b.y+=b.vy*h;

  if(b.y<BR){b.y=BR;b.vy=-b.vy*P.wall;}
  if(b.y>H-BR){b.y=H-BR;b.vy=-b.vy*P.wall;}
  if(b.x<BR){ if(b.y>GY0&&b.y<GY1) return 'g1'; b.x=BR;b.vx=-b.vx*P.wall; }
  if(b.x>W-BR){ if(b.y>GY0&&b.y<GY1) return 'g0'; b.x=W-BR;b.vx=-b.vx*P.wall; }

  const cr=Math.min(P.crn,FHX-0.5,FHY-0.5);
  for(const r of RODS){
    if(!footDown(r)) continue;            // figurine levée : la balle passe dessous
    const fx=footX(r);
    if(Math.abs(b.x-fx)>FHX+BR) continue;
    const svx=footVX(r), svy=r.vy;        // vitesse de la surface du pied
    for(let i=0;i<r.n;i++){
      const fy=figY(r,i), dx=b.x-fx, dy=b.y-fy;
      // point le plus proche sur le pied, rectangle à angles arrondis :
      // face plate au centre qui renvoie droit, angles qui ouvrent
      const ix=Math.max(-(FHX-cr),Math.min(FHX-cr,dx));
      const iy=Math.max(-(FHY-cr),Math.min(FHY-cr,dy));
      let ox=dx-ix, oy=dy-iy, d=Math.hypot(ox,oy);
      const rr=cr+BR;
      if(d>=rr) continue;
      if(d<1e-6){ ox=Math.sign(dx)||1; oy=0; d=1; }
      const nx=ox/d, ny=oy/d;
      b.x=fx+ix+nx*rr; b.y=fy+iy+ny*rr;

      // tout se joue dans le repère du pied : c'est lui qui bouge
      let rvx=b.vx-svx, rvy=b.vy-svy;
      const vn=rvx*nx+rvy*ny;
      if(vn<0){ rvx-=(1+P.figr)*vn*nx; rvy-=(1+P.figr)*vn*ny; }
      // adhérence : le pied entraîne la balle au lieu de la laisser filer
      const vn2=rvx*nx+rvy*ny, tx=rvx-vn2*nx, ty=rvy-vn2*ny;
      rvx-=tx*P.grip; rvy-=ty*P.grip;
      b.vx=rvx+svx; b.vy=rvy+svy;
    }
  }
  const k=Math.exp(-P.fric*h);
  b.vx*=k; b.vy*=k;
  capV();
  return null;
}
function stepPhysics(dt){
  const b=S.ball;
  let mv=Math.hypot(b.vx,b.vy);
  for(const r of RODS) mv=Math.max(mv, Math.abs(r.om)*P.lf, Math.abs(r.vy));
  const n=Math.max(1,Math.min(48,Math.ceil(mv*dt/(BR*0.4))));
  for(let i=0;i<n;i++){ const g=stepSub(dt/n); if(g) return g; }
  return null;
}

/* --------------------------- balle morte ------------------------- */
const DZONE=[
  RODS.find(r=>r.team===0&&r.kind==='D').x,
  RODS.find(r=>r.team===1&&r.kind==='D').x,
];
function revive(){
  const b=S.ball;
  let own=-1;
  if(b.x<DZONE[0]) own=0; else if(b.x>DZONE[1]) own=1;
  let bx=0,by=0,bd=Infinity;
  for(const r of RODS){
    if(own>=0 && r.team!==own) continue;
    for(let i=0;i<r.n;i++){
      const fy=figY(r,i), d=Math.hypot(b.x-r.x,b.y-fy);
      if(d<bd){ bd=d; bx=r.x; by=fy; }
    }
  }
  const dx=bx-b.x, dy=by-b.y, len=Math.hypot(dx,dy)||1, v=P.vmax*0.18;
  b.vx=dx/len*v; b.vy=dy/len*v;
  S.log.push({t:'revive',m:S.matchN,zone:own,ms:Date.now()-S.t0});
}

/* -------------------------------- IA ----------------------------- */
function ai(dt,now){
  const foe=S.me^1, b=S.ball;
  for(const ri of MYRODS(foe)){
    const r=RODS[ri];
    if(now-r.aiT>260-160*P.ai){
      r.aiT=now;
      let ty=b.y;
      if(Math.abs(b.vx)>60){ const tt=Math.max(0,Math.min(.5,(r.x-b.x)/b.vx)); ty=b.y+b.vy*tt; }
      ty=Math.max(0,Math.min(H,ty));
      let fi=0,bd=Infinity;
      for(let i=0;i<r.n;i++){const d=Math.abs(ty-figY(r,i)); if(d<bd){bd=d;fi=i;}}
      r.aiT2=Math.max(-r.span,Math.min(r.span,r.off+(ty-figY(r,fi))));
    }
    const d=r.aiT2-r.off;
    r.tgt=r.off+Math.sign(d)*Math.min(Math.abs(d),P.slew*P.ai*dt);
    // frappe quand la balle entre dans l'arc du pied, du bon côté
    if(Math.abs(r.om)<1.5){
      let near=Infinity;
      for(let i=0;i<r.n;i++) near=Math.min(near,Math.abs(b.y-figY(r,i)));
      const ahead=(b.x-r.x)*DIR(foe);
      if(near<FHY+BR+6 && ahead>-(FHX+BR+4) && ahead<P.lf){
        const pw=r.kind==='A'?.92:r.kind==='M'?.55:.85;
        swing(ri,DIR(foe),pw*(.55+.45*P.ai));
      }
    }
  }
}
function assist(dt){
  if(P.ast<=0) return;
  const b=S.ball;
  for(const ri of MYRODS(S.me)){
    if(ri===S.sel) continue;
    const r=RODS[ri];
    let fi=0,bd=Infinity;
    for(let i=0;i<r.n;i++){const d=Math.abs(b.y-figY(r,i)); if(d<bd){bd=d;fi=i;}}
    const want=Math.max(-r.span,Math.min(r.span,r.off+(b.y-figY(r,fi))));
    r.tgt+=(want-r.tgt)*Math.min(1,4*P.ast*dt);
  }
}
function autoSel(){
  if(!S.auto||S.phase!=='play') return;
  const b=S.ball, mine=MYRODS(S.me);
  let best=S.sel, bd=Infinity;
  for(const ri of mine){ const d=Math.abs(b.x-RODS[ri].x); if(d<bd){bd=d;best=ri;} }
  if(best!==S.sel && mine.includes(S.sel) && Math.abs(b.x-RODS[S.sel].x)-bd < 45) return;
  S.sel=best;
}

/* ------------------------------ boucle --------------------------- */
const DT=1/240; let lastT=performance.now(), acc=0, netAcc=0;
function loop(now){
  const dr=Math.min(.05,(now-lastT)/1000); lastT=now;
  if(S.phase==='play'){
    autoSel(); assist(dr);
    if(NET.mode==='off') ai(dr,now);
    acc+=dr; let res=null;
    while(acc>=DT&&!res){ res=stepPhysics(DT); acc-=DT; }
    S.trail.push(S.ball.x,S.ball.y); if(S.trail.length>260) S.trail.splice(0,2);
    if(isHost()){
      if(Math.hypot(S.ball.vx,S.ball.vy)<90) S.stall+=dr; else S.stall=0;
      if(S.stall>P.stall){ revive(); S.stall=0; }
      if(res) goal(res==='g0'?0:1);
    }
    netAcc+=dr; if(netAcc>=1/60){ netAcc=0; netTick(); }
  } else acc=0;
  if(S.flash>0) S.flash=Math.max(0,S.flash-dr*1.5);
  draw(); requestAnimationFrame(loop);
}

function goal(t){
  S.score[t]++; S.flash=1;
  if(S.firstGoalMs===null){S.firstGoalMs=Date.now()-S.t0;S.log.push({t:'firstgoal',m:S.matchN,ms:S.firstGoalMs});}
  S.log.push({t:'goal',m:S.matchN,team:t,ms:Date.now()-S.t0});
  if(S.score[t]>=WIN_SCORE){ S.phase='end'; overlay(); send({p:'end',sc:S.score}); return; }
  S.phase='pause'; setTimeout(()=>serve(t^1),800);
}
const WIN_SCORE=5;
function serve(team){
  // remise en jeu au centre, roulée vers le camp de celui qui a encaissé
  RODS.forEach(r=>{ r.om=0; r.th=0; });
  S.ball.x=W/2; S.ball.y=H/2;
  S.ball.vx=-DIR(team)*P.vmax*0.14; S.ball.vy=0;
  S.stall=0; S.trail.length=0;
  if(S.sel<0||RODS[S.sel].team!==S.me) S.sel=RODS.findIndex(q=>q.team===S.me&&q.kind==='M');
  S.phase='play'; buildRods(); document.getElementById('ov').classList.remove('on'); chrome();
}
function newMatch(keep){
  S.score=[0,0]; S.matchN++; S.firstGoalMs=null; S.t0=Date.now();
  if(!keep) S.chain=0;
  RODS.forEach(r=>{r.off=0;r.tgt=0;r.th=0;r.om=0;});
  S.serveTo = (S.matchN===1) ? (Math.random()<0.5?0:1) : (S.serveTo^1);
  serve(S.serveTo);
}

/* ------------------------------ réseau --------------------------- */
function send(o){ if(NET.conn&&NET.up){ try{NET.conn.send(o);}catch(e){} } }
function sendCfg(){ if(NET.mode==='host') send({cfg:P}); }
function netTick(){
  if(NET.mode==='off'||!NET.up) return;
  const b=S.ball;
  if(NET.mode==='host'){
    send({s:1, b:[Math.round(b.x*4)/4,Math.round(b.y*4)/4,Math.round(b.vx),Math.round(b.vy)],
          r:RODS.map(r=>Math.round(r.off*4)/4),
          a:RODS.map(r=>Math.round(r.th*1000)/1000),
          sc:S.score, p:S.phase, m:S.matchN, ch:S.chain});
  } else {
    send({i:1, t:MYRODS(1).map(ri=>Math.round(RODS[ri].tgt*4)/4)});
  }
}
function onMsg(d){
  NET.lastRx=performance.now();
  if(d.s){
    const b=S.ball;
    b.x=d.b[0]; b.y=d.b[1]; b.vx=d.b[2]; b.vy=d.b[3];
    for(let i=0;i<8;i++){
      const r=RODS[i];
      if(r.team===S.me) continue;      // mes barres restent prédites en local
      r.off=d.r[i]; r.tgt=d.r[i]; r.th=d.a[i];
    }
    S.score=d.sc;
    if(d.ch!==undefined) S.chain=d.ch;
    if(d.m!==undefined && d.m!==S.matchN){
      S.matchN=d.m; S.t0=Date.now(); S.firstGoalMs=null;
      for(const ri of MYRODS(S.me)){ const r=RODS[ri]; r.off=0; r.tgt=0; r.th=0; r.om=0; }
    }
    if(d.p!==S.phase){
      S.phase=d.p;
      if(d.p==='play'){
        if(S.sel<0||RODS[S.sel].team!==S.me) S.sel=RODS.findIndex(q=>q.team===S.me&&q.kind==='M');
        document.getElementById('ov').classList.remove('on'); buildRods(); chrome();
      } else overlay();
    }
  } else if(d.i){ MYRODS(1).forEach((ri,k)=>{ RODS[ri].tgt=d.t[k]; }); }
  else if(d.cfg){ Object.assign(P,d.cfg); syncTune(); }
  else if(d.cf){ if(NET.mode==='host'){ P[d.cf[0]]=+d.cf[1]; syncTune(); sendCfg(); } }
  else if(d.k){ swing(d.k[0],d.k[1],d.k[2]); }
  else if(d.rm){ if(NET.mode==='host'){ S.chain++; S.log.push({t:'rematch',chain:S.chain}); save(); newMatch(true); } }
  else if(d.p==='end'){ S.phase='end'; S.score=d.sc||S.score; overlay(); }
}
function wire(c){
  NET.conn=c;
  c.on('open',()=>{ NET.up=true; NET.lastRx=performance.now();
    if(NET.mode==='host'){ S.me=0; sendCfg(); newMatch(false); }
    else { S.me=1; S.phase='wait'; overlay(); } });
  c.on('data',onMsg);
  c.on('close',()=>{ NET.up=false; NET.err='Connexion fermée.'; S.phase='menu'; overlay(); });
  c.on('error',()=>{ NET.up=false; NET.err='Erreur de connexion.'; S.phase='menu'; overlay(); });
}
const ALPH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const mkCode=()=>Array.from({length:4},()=>ALPH[Math.floor(Math.random()*ALPH.length)]).join('');
function netFail(m){ NET.err=m; NET.mode='off'; if(NET.peer){try{NET.peer.destroy();}catch(e){}} NET.peer=null; S.phase='menu'; overlay(); }
function doHost(){
  if(typeof Peer==='undefined') return netFail("La bibliothèque réseau n'a pas pu être chargée.");
  NET.mode='host'; NET.code=mkCode(); NET.err=''; S.phase='hosting'; overlay();
  NET.peer=new Peer('bf6-'+NET.code,{debug:0});
  NET.peer.on('open',()=>{ S.phase='hosting'; overlay(); });
  NET.peer.on('connection',c=>wire(c));
  NET.peer.on('error',e=>{
    if(e&&e.type==='unavailable-id'){ try{NET.peer.destroy();}catch(x){} return doHost(); }
    netFail("Réseau indisponible ici. Utilise l'APK ou la page GitHub Pages, pas l'aperçu web.");
  });
}
function doJoin(code){
  if(typeof Peer==='undefined') return netFail("La bibliothèque réseau n'a pas pu être chargée.");
  NET.mode='guest'; NET.err=''; S.phase='joining'; overlay();
  NET.peer=new Peer({debug:0});
  NET.peer.on('open',()=>{ wire(NET.peer.connect('bf6-'+code,{reliable:true})); });
  NET.peer.on('error',e=>netFail(e&&e.type==='peer-unavailable' ? 'Aucune partie avec ce code.'
    : "Réseau indisponible ici. Utilise l'APK ou la page GitHub Pages, pas l'aperçu web."));
}

/* ------------------------------ rendu ---------------------------- */
function rrect(x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,r);
  else{ ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
        ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
}
// direction que prendrait la balle si le pied la touchait maintenant :
// la normale du contact. Géométrie au présent, jamais une prédiction de rebond.
function aimLine(){
  if(S.phase!=='play'||S.sel<0) return;
  const r=RODS[S.sel], b=S.ball;
  if(!r||r.team!==S.me||!footDown(r)) return;
  const fx=footX(r);
  let fi=-1,m=Infinity;
  for(let i=0;i<r.n;i++){ const d=Math.hypot(b.x-fx,b.y-figY(r,i)); if(d<m){m=d;fi=i;} }
  if(m>FHX+FHY+BR+10) return;
  const dx=b.x-fx, dy=b.y-figY(r,fi), len=Math.hypot(dx,dy)||1;
  ctx.save(); ctx.setLineDash([7,6]); ctx.lineWidth=2;
  ctx.strokeStyle='rgba(255,224,122,.55)';
  ctx.beginPath(); ctx.moveTo(SX(b.x),SY(b.y));
  ctx.lineTo(SX(b.x+dx/len*150),SY(b.y+dy/len*150)); ctx.stroke(); ctx.restore();
}
function beads(){
  const s=V.s, y=TOPH/2+2, rr=6.5, gap=17;
  const LEFT=V.ox+8, RIGHT=V.ox+W*s-8-gap*(WIN_SCORE-1);
  for(let t=0;t<2;t++){
    const col=t===0?'#D65445':'#4E8CC4';
    const base=(t===0)===FLIP() ? RIGHT : LEFT;
    for(let i=0;i<WIN_SCORE;i++){
      const px=base+gap*i;
      ctx.beginPath(); ctx.arc(px,y,rr,0,7);
      if(i<S.score[t]){ ctx.fillStyle=col; ctx.fill(); }
      else { ctx.strokeStyle='rgba(142,154,148,.55)'; ctx.lineWidth=1.4; ctx.stroke(); }
      if(t===S.me&&i===0){ ctx.fillStyle=col; ctx.font='600 9px "JetBrains Mono",monospace';
        ctx.textAlign='left'; ctx.fillText('TOI',px-rr,y+rr+10); }
    }
  }
}
function draw(){
  const w=innerWidth,h=innerHeight,s=V.s;
  ctx.fillStyle='#0F1411'; ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#12211A'; ctx.fillRect(V.ox-9,V.oy-9,W*s+18,H*s+18);
  ctx.fillStyle='#1B4B37'; ctx.fillRect(V.ox,V.oy,W*s,H*s);
  ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=1.4;
  ctx.strokeRect(V.ox,V.oy,W*s,H*s);
  ctx.beginPath(); ctx.moveTo(SX(W/2),SY(0)); ctx.lineTo(SX(W/2),SY(H)); ctx.stroke();
  ctx.beginPath(); ctx.arc(SX(W/2),SY(H/2),90*s,0,7); ctx.stroke();
  const GW=15, gy=Math.min(SY(GY0),SY(GY1)), gh=Math.abs(SY(GY1)-SY(GY0));
  ctx.fillStyle='#D65445'; ctx.fillRect(SX(0)+(FLIP()?0:-GW),gy,GW,gh);
  ctx.fillStyle='#4E8CC4'; ctx.fillRect(SX(W)+(FLIP()?-GW:0),gy,GW,gh);

  if(S.trail.length>4){
    ctx.lineCap='round';
    for(let i=2;i<S.trail.length;i+=2){
      const a=i/S.trail.length;
      ctx.strokeStyle='rgba(255,236,160,'+(a*.5).toFixed(3)+')';
      ctx.lineWidth=Math.max(1,a*3.5);
      ctx.beginPath(); ctx.moveTo(SX(S.trail[i-2]),SY(S.trail[i-1]));
      ctx.lineTo(SX(S.trail[i]),SY(S.trail[i+1])); ctx.stroke();
    }
  }
  const cr=Math.min(P.crn,FHX-.5);
  for(let ri=0;ri<RODS.length;ri++){
    const r=RODS[ri], mine=r.team===S.me, act=ri===S.sel, down=footDown(r), fx=footX(r);
    ctx.strokeStyle=act?'#4FB183':(mine?'#B9C6BF':'rgba(142,154,148,.45)');
    ctx.lineWidth=act?3:(mine?2.2:1.7);
    ctx.beginPath(); ctx.moveTo(SX(r.x),SY(-20)); ctx.lineTo(SX(r.x),SY(H+20)); ctx.stroke();
    for(let i=0;i<r.n;i++){
      const fy=figY(r,i);
      // la jambe, de l'axe de la barre jusqu'au pied : elle montre la rotation
      ctx.strokeStyle='rgba(180,192,186,.5)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(SX(r.x),SY(fy)); ctx.lineTo(SX(fx),SY(fy)); ctx.stroke();
      rrect(SX(fx)-FHX*s,SY(fy)-FHY*s,FHX*2*s,FHY*2*s,cr*s);
      ctx.fillStyle=r.team===0?'#D65445':'#4E8CC4';
      ctx.globalAlpha=down?(mine?1:.82):.3;      // figurine levée : la balle passe dessous
      ctx.fill(); ctx.globalAlpha=1;
      ctx.strokeStyle=down?'rgba(0,0,0,.45)':'rgba(255,255,255,.35)';
      ctx.lineWidth=1.4; if(!down) ctx.setLineDash([3,3]);
      ctx.stroke(); ctx.setLineDash([]);
    }
  }
  const b=S.ball;
  aimLine();
  ctx.beginPath(); ctx.arc(SX(b.x),SY(b.y),BR*s,0,7);
  ctx.fillStyle='#F5E9C8'; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=1; ctx.stroke();
  beads();
  if(S.flash>0){ ctx.fillStyle='rgba(255,255,255,'+(S.flash*.3).toFixed(3)+')'; ctx.fillRect(0,0,w,h); }
}

/* ------------------------------ gestes --------------------------- */
// Écran coupé en deux : moitié gauche = coulisser la barre, moitié droite =
// lancer la rotation. Deux pointeurs suivis en parallèle, un par moitié.
const powBar=document.getElementById('pow');
let Gs=null, Gf=null;
const guard=t=>!!(t.closest&&(t.closest('#rods')||t.closest('#tune')||t.closest('#ov')||t.closest('#tuneBtn')));

addEventListener('pointerdown',e=>{
  if(guard(e.target)||S.phase!=='play') return;
  const g={id:e.pointerId,px:e.clientX,py:e.clientY,
           pts:[{x:e.clientX,y:e.clientY,t:performance.now()}],fired:false};
  if(e.clientX < innerWidth/2){ if(!Gs) Gs=g; } else { if(!Gf) Gf=g; }
  e.preventDefault();
},{passive:false});

function moveSlide(g,x,y){
  const dy=y-g.py;
  if(dy!==0){
    const r=RODS[S.sel];
    if(r&&r.team===S.me){
      const d=(dy/Math.max(.001,V.s))*(FLIP()?-1:1);
      r.tgt=Math.max(-r.span,Math.min(r.span,r.tgt+d));
    }
  }
  g.px=x; g.py=y;
}
function moveFlick(g,x,y,now){
  if(g.fired) return;
  const w0=g.pts.find(q=>now-q.t<=P.win)||g.pts[0];
  const dx=x-w0.x, dy=y-w0.y;
  if(Math.abs(dx)<P.trv || Math.abs(dx)<Math.abs(dy)*0.8) return;
  const dt=Math.max(16,now-w0.t), vx=dx/dt*1000;
  if(Math.abs(vx)<=260) return;
  const pw=Math.max(0,Math.min(1,(Math.abs(vx)-260)/Math.max(200,P.pwv)));
  if(S.sel>=0){
    const dir=(Math.sign(dx)||1)*(FLIP()?-1:1);
    swing(S.sel,dir,pw);
    if(!isHost()) send({k:[S.sel,dir,pw]});
    powBar.style.width=(pw*100).toFixed(0)+'%';
    setTimeout(()=>powBar.style.width='0%',350);
  }
  g.fired=true; Gf=null;
}
addEventListener('pointermove',e=>{
  const now=performance.now(), x=e.clientX, y=e.clientY;
  for(const g of [Gs,Gf]){
    if(!g||g.id!==e.pointerId) continue;
    g.pts.push({x,y,t:now});
    while(g.pts.length>2&&now-g.pts[0].t>240) g.pts.shift();
    if(g===Gs) moveSlide(g,x,y); else moveFlick(g,x,y,now);
    e.preventDefault();
  }
},{passive:false});
['pointerup','pointercancel'].forEach(ev=>addEventListener(ev,e=>{
  if(Gs&&Gs.id===e.pointerId) Gs=null;
  if(Gf&&Gf.id===e.pointerId) Gf=null;
},{passive:false}));

/* -------------------------------- UI ----------------------------- */
function buildRods(){
  const host=document.getElementById('rods'); host.innerHTML='';
  if(S.phase!=='play') return;
  const list=MYRODS(S.me).slice(); if(FLIP()) list.reverse();
  for(const ri of list){
    const r=RODS[ri], el=document.createElement('button');
    el.className='rodbtn t'+r.team+(ri===S.sel?' on':'');
    el.innerHTML='<span class="lab">'+r.kind+'</span>'+KN[r.kind];
    el.onpointerdown=ev=>{ev.stopPropagation();S.auto=false;saveAuto();S.sel=ri;buildRods();};
    host.appendChild(el);
  }
  const a=document.createElement('button');
  a.className='autobtn'+(S.auto?' on':'');
  a.innerHTML='<b>AUTO</b>'+(S.auto?'activé':'manuel');
  a.onpointerdown=ev=>{ev.stopPropagation();S.auto=!S.auto;saveAuto();buildRods();};
  host.appendChild(a);
  resize();
}
function saveAuto(){ try{localStorage.setItem('bf6_auto',S.auto?'1':'0');}catch(e){} }
try{ S.auto=localStorage.getItem('bf6_auto')==='1'; }catch(e){}

function chrome(){
  const playing = S.phase==='play'||S.phase==='pause';
  document.getElementById('tuneBtn').style.display = playing ? 'none' : '';
  document.getElementById('hint').style.display = playing ? '' : 'none';
  if(playing) document.getElementById('tune').classList.remove('on');
}
let bstate='';
setInterval(()=>{
  chrome();
  if(S.phase!=='play') return;
  const k=S.sel+'|'+S.auto;
  if(k!==bstate){ bstate=k; buildRods(); }
  if(NET.mode!=='off'&&NET.up&&performance.now()-NET.lastRx>4000){
    NET.up=false; NET.err='Connexion perdue.'; S.phase='menu'; overlay();
  }
},120);

function fs(){ const e=document.documentElement;
  if(e.requestFullscreen) e.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
  if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
}
function overlay(){

        Pp=document.getElementById('ovP'),B=document.getElementById('ovB');

    ov.classList.add('on'); buildRods(); chrome(); };
  const err=NET.err?'<br><br><b style="color:#D65445">'+NET.err+'</b>':'';
  if(S.phase==='menu'){
    show('Babyfoot',
     'Temps réel. Match en '+WIN_SCORE+' buts.<br><br>'+
     'La figurine est un <b>pendule</b> : elle pend au repos — c\'est la position de blocage — '+
     'et la chiquenaude ne fait que lui donner de l\'élan. Elle frappe la balle où qu\'elle soit '+
     'sur son arc, puis retombe. <b>Trop haute, elle laisse passer la balle dessous.</b><br><br>'+
     'Écran coupé en deux : <b>moitié gauche, glisser ↕</b> pour coulisser · '+

  } else if(S.phase==='code'){

    i.oninput=()=>{ i.value=i.value.toUpperCase().replace(/[^A-Z0-9]/g,'');

    const b=document.createElement('button'); b.className='bigbtn pri'; b.textContent='Connexion'; b.onclick=go;

  } else if(S.phase==='hosting'){

      [['Annuler',()=>{try{NET.peer.destroy();}catch(e){} NET.mode='off';S.phase='menu';overlay();}]]);
  } else if(S.phase==='joining'){ show('Connexion…','Recherche de la partie.',[]); }
  else if(S.phase==='wait'){ show('Connecté','En attente du coup d\'envoi.',[]); }
  else if(S.phase==='end'){
    const win=S.score[0]>S.score[1]?'ROUGE':'BLEU';
    const mine=(S.score[0]>S.score[1]?0:1)===S.me;
    S.log.push({t:'matchend',m:S.matchN,score:S.score.slice(),chain:S.chain,firstGoalMs:S.firstGoalMs,ms:Date.now()-S.t0});
    save();
    show((mine?'Tu gagnes':win+' gagne'), S.score[0]+' — '+S.score[1]+
      (S.firstGoalMs!==null?'<br>premier but à '+(S.firstGoalMs/1000).toFixed(0)+' s':''),
     [['Revanche',()=>{S.chain++;S.log.push({t:'rematch',chain:S.chain});save();
        if(isHost()) newMatch(true); else send({rm:1});}],
      ['Arrêter',()=>{S.log.push({t:'stop',chain:S.chain});save();
        if(NET.peer){try{NET.peer.destroy();}catch(e){}} NET.mode='off';NET.up=false;S.phase='menu';overlay();}]]);
  } else { ov.classList.remove('on'); chrome(); }
}

/* ---------------------------- journal ---------------------------- */
function save(){ try{localStorage.setItem('bf6_log',JSON.stringify(S.log.slice(-600)));}catch(e){} }
document.getElementById('dumpBtn').onclick=()=>{
  const sw=S.log.filter(e=>e.t==='swing'&&e.team===S.me);
  const rev=S.log.filter(e=>e.t==='revive');
  const rem=S.log.filter(e=>e.t==='rematch').length;
  const fg=S.log.filter(e=>e.t==='firstgoal').map(e=>(e.ms/1000).toFixed(0)+'s').join(' ');
  const gl=S.log.filter(e=>e.t==='goal');
  document.getElementById('logout').value=
    'chiquenaudes '+sw.length+'  |  buts '+gl.length+'\n'+
    'balles mortes relancées '+rev.length+'\n'+
    'revanches '+rem+'  |  1er but: '+(fg||'—')+'\n\n'+JSON.stringify(S.log.slice(-25));
};

/* ---------------------------- réglages --------------------------- */
const KEYS=['lf','omax','grav','adamp','grip','figr','crn','wall','fric','vmax','slew','stall','ast','ai','trv','win','pwv'];
const INT={lf:1,omax:1,vmax:1,slew:1,trv:1,win:1,pwv:1};
function syncTune(){
  KEYS.forEach(k=>{
    const i=document.getElementById('i_'+k),o=document.getElementById('o_'+k); if(!i) return;
    const fmt=v=>INT[k]?v:(+v).toFixed(2);
    i.value=P[k]; o.textContent=fmt(P[k]);
    i.oninput=()=>{P[k]=+i.value;o.textContent=fmt(P[k]);
      try{localStorage.setItem('bf6_tune',JSON.stringify(P));}catch(e){}
      if(NET.mode==='host') sendCfg(); else if(NET.mode==='guest') send({cf:[k,+i.value]});};
  });
}
document.getElementById('tuneBtn').onclick=()=>document.getElementById('tune').classList.toggle('on');
document.getElementById('resetBtn').onclick=()=>{P=Object.assign({},DEF);syncTune();
  try{localStorage.setItem('bf6_tune',JSON.stringify(P));}catch(e){}
  if(NET.mode==='host') sendCfg();};
document.getElementById('menuBtn').onclick=()=>{
  document.getElementById('tune').classList.remove('on');
  if(NET.peer){try{NET.peer.destroy();}catch(e){}} NET.mode='off';NET.up=false;
  S.phase='menu'; overlay();
};

syncTune(); resize(); overlay();
requestAnimationFrame(loop);
</script>
