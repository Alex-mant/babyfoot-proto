name: APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer les dépendances
        run: npm install

      - name: Générer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Forcer l'orientation paysage
        run: |
          python3 - <<'PY'
          import re, io
          p = 'android/app/src/main/AndroidManifest.xml'
          s = io.open(p, encoding='utf-8').read()
          if 'screenOrientation' not in s:
              s = s.replace('<activity', '<activity\n            android:screenOrientation="sensorLandscape"', 1)
          io.open(p, 'w', encoding='utf-8').write(s)
          print(s)
          PY

      - name: Construire l'APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk babyfoot-proto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: babyfoot-apk
          path: babyfoot-proto.apk

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: APK de test
          body: |
            APK de debug du prototype, reconstruit à chaque push sur `main`.

            **Installation** : télécharge `babyfoot-proto.apk` depuis ton téléphone,
            puis autorise l'installation depuis une source inconnue quand Android le demande.

            Version web (aucune installation) : voir le README.
          files: babyfoot-proto.apk
          make_latest: true
